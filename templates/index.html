<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .converter {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 380px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:hover {
            background: #444;
        }

        #result {
            text-align: center;
            margin-top: 25px;
        }

        #rate {
            text-align: center;
            color: #666;
            margin-top: 10px;
        }

    </style>

</head>


<body>

    <div class="converter">

        <h1>Currency Converter</h1>


        <label>From</label>

        <select id="from_currency">

            <option value="USD">USD - US Dollar</option>

            <option value="EUR">EUR - Euro</option>

            <option value="GBP">GBP - British Pound</option>

            <option value="GHS">GHS - Ghana Cedi</option>

            <option value="NGN">NGN - Nigerian Naira</option>

        </select>


        <label>To</label>

        <select id="to_currency">

            <option value="GHS">GHS - Ghana Cedi</option>

            <option value="USD">USD - US Dollar</option>

            <option value="EUR">EUR - Euro</option>

            <option value="GBP">GBP - British Pound</option>

            <option value="NGN">NGN - Nigerian Naira</option>

        </select>


        <label>Amount</label>

        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            min="0"
        >


        <button onclick="convertCurrency()">
            Convert
        </button>


        <h2 id="result"></h2>

        <p id="rate"></p>

    </div>


    <script>

        async function convertCurrency() {

            const fromCurrency =
                document.getElementById("from_currency").value;

            const toCurrency =
                document.getElementById("to_currency").value;

            const amount =
                document.getElementById("amount").value;


            if (amount === "" || amount <= 0) {

                document.getElementById("result").innerText =
                    "Please enter a valid amount.";

                document.getElementById("rate").innerText = "";

                return;
            }


            try {

                const response = await fetch(
                    `/convert?from_currency=${fromCurrency}&to_currency=${toCurrency}&amount=${amount}`
                );


                const data = await response.json();


                document.getElementById("result").innerText =
                    `${data.amount} ${data.from_currency} = ${data.converted_amount} ${data.to_currency}`;


                document.getElementById("rate").innerText =
                    `Exchange rate: 1 ${data.from_currency} = ${data.exchange_rate} ${data.to_currency}`;

            }


            catch (error) {

                document.getElementById("result").innerText =
                    "Unable to get exchange rate.";

                document.getElementById("rate").innerText = "";

            }

        }

    </script>

</body>

</html>
